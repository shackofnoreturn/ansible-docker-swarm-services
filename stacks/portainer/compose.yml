version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:latest

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker-data/portainer:/data

    deploy:
      placement:
        constraints:
          - node.role == manager
