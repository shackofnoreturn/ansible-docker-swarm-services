version: "3.8"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest

    volumes:
      - /opt/docker-data/jellyfin/config:/config
      - /opt/docker-data/jellyfin/cache:/cache
      - /mnt/media:/media

    networks:
      - proxy

    deploy:
      placement:
        constraints:
          - node.labels.media == true

      labels:
        - traefik.enable=true
        - traefik.http.routers.jellyfin.rule=Host(`jellyfin.shackofnoreturn.com`)
        - traefik.http.services.jellyfin.loadbalancer.server.port=8096

networks:
  proxy:
    external: true
