version: "3.8"

services:
  filebrowser:
    image: filebrowser/filebrowser:latest

    volumes:
      - /mnt:/srv
      - /opt/docker-data/filebrowser:/database

    networks:
      - proxy

    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.filebrowser.rule=Host(`files.shackofnoreturn.com`)
        - traefik.http.services.filebrowser.loadbalancer.server.port=80

networks:
  proxy:
    external: true
