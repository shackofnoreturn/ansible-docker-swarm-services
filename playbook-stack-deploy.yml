---
- name: Gather Reachable Nodes
  hosts: localhost
  gather_facts: false

  roles:
    - gather-reachable-hosts


- name: Deploy Docker Stack
  hosts: docker_online
  become: true
  gather_facts: false

  roles:
    - docker-stack-sync
    - docker-stack-validate
    - docker-stack-remove
    - docker-stack-deploy
