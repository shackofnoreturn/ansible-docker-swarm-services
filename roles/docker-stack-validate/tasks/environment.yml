---
- name: Build stack environment
  ansible.builtin.set_fact:
    stack_environment: >-
      {{
        global_definition.environment | default({})
        | combine(stack_definition.environment | default({}))
        | combine(docker_stack_environment | default({}))
      }}

- name: Build Compose file list
  ansible.builtin.set_fact:
    stack_compose_files: >-
      {{
        (stack_definition.compose_files | default([stack_definition.compose_file] if stack_definition.compose_file is defined else []))
        + (docker_stack_compose_overrides | default({})).get(stack_name, [])
      }}

- name: Build Compose file paths
  ansible.builtin.set_fact:
    stack_compose_paths: "{{ stack_compose_files | map('regex_replace', '^', stack_path ~ '/') | list }}"
