---
- name: Validate Compose files are configured
  assert:
    that:
      - stack_compose_files | length > 0
    fail_msg: "Stack {{ stack_name }} must define compose_file or compose_files"

- name: Check Compose files exist
  stat:
    path: "{{ item }}"
  loop: "{{ stack_compose_paths }}"
  register: compose_files

- name: Validate Compose files exist
  assert:
    that:
      - compose_files.results | selectattr('stat.exists') | list | length == stack_compose_paths | length
    fail_msg:
      >
      One or more Compose files are missing for stack {{ stack_name }}:
      {{ stack_compose_paths }}

- name: Validate merged Compose configuration
  command:
    cmd: >-
      docker compose
      {{ stack_compose_paths | map('regex_replace', '^', '-f ') | join(' ') }}
      config --format json
  environment: "{{ stack_environment }}"
  register: compose_validation
  changed_when: false
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Fail on invalid Compose or unresolved variables
  assert:
    that:
      - compose_validation.rc == 0
      - compose_validation.stderr | regex_search('(?i)variable .+ is not set') is none
    fail_msg: >-
      Compose validation failed for stack {{ stack_name }}.
      Return code: {{ compose_validation.rc }}.
      Diagnostics: {{ compose_validation.stderr | default('') }}
  run_once: true

- name: Parse normalized Compose configuration
  set_fact:
    stack_compose_model: "{{ compose_validation.stdout | from_json }}"
  run_once: true

- name: Initialize external resource lists
  set_fact:
    stack_external_networks: []
    stack_external_secrets: []
  run_once: true

- name: Collect external network names
  set_fact:
    stack_external_networks: >-
      {{ stack_external_networks + [item.value.name | default(item.key)] }}
  loop: "{{ stack_compose_model.networks | default({}) | dict2items }}"
  when: item.value.external | default(false) | bool
  run_once: true

- name: Collect external secret names
  set_fact:
    stack_external_secrets: >-
      {{ stack_external_secrets + [item.value.name | default(item.key)] }}
  loop: "{{ stack_compose_model.secrets | default({}) | dict2items }}"
  when: item.value.external | default(false) | bool
  run_once: true

- name: Inspect required external networks
  command:
    argv:
      - docker
      - network
      - inspect
      - "{{ item }}"
  loop: "{{ stack_external_networks | unique }}"
  register: external_network_checks
  changed_when: false
  failed_when: false
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Inspect required external secrets
  command:
    argv:
      - docker
      - secret
      - inspect
      - "{{ item }}"
  loop: "{{ stack_external_secrets | unique }}"
  register: external_secret_checks
  changed_when: false
  failed_when: false
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Fail when external Swarm resources are missing
  assert:
    that:
      - external_network_checks.results | rejectattr('rc', 'equalto', 0) | list | length == 0
      - external_secret_checks.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Missing external Swarm resources for stack {{ stack_name }}.
      Networks: {{ external_network_checks.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}.
      Secrets: {{ external_secret_checks.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}.
      Create the required resources in the target Swarm before deploying.
  run_once: true

- name: Collect services with placement constraints
  set_fact:
    stack_placement_services: >-
      {{
        stack_compose_model.services | default({}) | dict2items
        | selectattr('value.deploy.placement.constraints', 'defined')
        | list
      }}
  run_once: true

- name: Validate supported placement constraints
  assert:
    that:
      - item.value.deploy.placement.constraints | reject('match', '^node\\.(role|labels\\.[A-Za-z0-9_-]+) == [^ ]+$') | list | length == 0
    fail_msg: >-
      Service {{ item.key }} in stack {{ stack_name }} uses a placement
      constraint this preflight cannot check:
      {{ item.value.deploy.placement.constraints }}.
      Supported forms are node.role == <role> and
      node.labels.<label> == <value>.
  loop: "{{ stack_placement_services }}"
  run_once: true

- name: Check placement candidates for each service
  command:
    argv: >-
      {{
        ['docker', 'node', 'ls']
        + (
          placement_service.value.deploy.placement.constraints
          | select('match', '^node.role == ')
          | map('replace', 'node.role == ', '--filter=role=')
          | list
        )
        + (
          placement_service.value.deploy.placement.constraints
          | select('match', '^node.labels\\.')
          | map('replace', 'node.labels.', '')
          | map('replace', ' == ', '=')
          | map('regex_replace', '^', '--filter=label=')
          | list
        )
        + ['--format', '{{json .}}']
      }}
  loop: "{{ stack_placement_services }}"
  loop_control:
    loop_var: placement_service
    label: "{{ placement_service.key }}"
  register: placement_node_checks
  changed_when: false
  failed_when: false
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Require a Ready and Active placement candidate
  assert:
    that:
      - item.rc == 0
      - >-
        item.stdout_lines
        | map('from_json')
        | selectattr('Status', 'equalto', 'Ready')
        | selectattr('Availability', 'equalto', 'Active')
        | list
        | length > 0
    fail_msg: >-
      No Ready and Active Swarm node matches the placement constraints for
      service {{ item.placement_service.key }} in stack {{ stack_name }}.
      Constraints: {{ item.placement_service.value.deploy.placement.constraints }}.
      Docker node ls candidates: {{ item.stdout_lines | default([]) }}.
      Check node roles, labels, and availability in the target Swarm.
  loop: "{{ placement_node_checks.results }}"
  loop_control:
    label: "{{ item.placement_service.key }}"
  run_once: true


- name: Validate runtime directories
  stat:
    path: "{{ item }}"
  loop: "{{ stack_definition.runtime_directories | default([]) }}"
  register: runtime_checks
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Initialize missing runtime directory list
  set_fact:
    missing_runtime_directories: []
  run_once: true

- name: Collect missing runtime directories
  set_fact:
    missing_runtime_directories: "{{ missing_runtime_directories + [item.item] }}"
  loop: "{{ runtime_checks.results }}"
  when: not (item.stat.isdir | default(false))
  run_once: true

- name: Fail when runtime directories are missing
  assert:
    that:
      - missing_runtime_directories | length == 0
    fail_msg: >-
      Runtime directories are missing for stack {{ stack_name }}:
      {{ missing_runtime_directories }}
  run_once: true

- name: Display validation result
  debug:
    msg:
      - "Stack: {{ stack_name }}"
      - "Path: {{ stack_path }}"
      - "Compose and runtime prerequisites validated"
  run_once: true
