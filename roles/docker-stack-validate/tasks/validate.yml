---
- name: Validate Compose files are configured
  assert:
    that:
      - stack_compose_files | length > 0
    fail_msg: "Stack {{ stack_name }} must define compose_file or compose_files"

- name: Check Compose files exist
  stat:
    path: "{{ item }}"
  loop: "{{ stack_compose_paths }}"
  register: compose_files

- name: Validate Compose files exist
  assert:
    that:
      - compose_files.results | selectattr('stat.exists') | list | length == stack_compose_paths | length
    fail_msg:
      >
      One or more Compose files are missing for stack {{ stack_name }}:
      {{ stack_compose_paths }}


- name: Validate runtime directories
  stat:
    path: "{{ item }}"
  loop: "{{ stack_definition.runtime_directories | default([]) }}"
  register: runtime_checks


- name: Display validation result
  debug:
    msg:
      - "Stack: {{ stack_name }}"
      - "Path: {{ stack_path }}"
      - "Validation successful"
