---
- name: Set deploy key
  set_fact:
    docker_stacks_deploy_key: "{{ lookup('env', 'docker_stacks_deploy_key') }}"
  no_log: true


- block:
    - name: Write deploy key
      copy:
        content: "{{ docker_stacks_deploy_key | replace('\\n', '\n') }}"
        dest: "{{ docker_stacks_deploy_key_path }}"
        mode: "0600"
      no_log: true


    - name: Clone repository
      git:
        repo: "{{ docker_stacks_repo }}"
        dest: "{{ docker_root }}"
        version: "main"
        force: true
        accept_hostkey: true
        key_file: "{{ docker_stacks_deploy_key_path }}"

        
  always:
    - name: Remove deploy key
      file:
        path: "{{ docker_stacks_deploy_key_path }}"
        state: absent
