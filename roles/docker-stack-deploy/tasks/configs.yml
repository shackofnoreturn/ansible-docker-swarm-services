---
- name: Check config directory
  stat:
    path: "{{ stack_path }}/configs"
  register: stack_config_directory
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Find config files
  find:
    paths: "{{ stack_path }}/configs"
    patterns: "*"
    recurse: true
    file_type: file
  register: config_files
  when: stack_config_directory.stat.isdir | default(false)
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Ensure controller config source directory exists
  file:
    path: "/tmp/ansible-stack-configs/{{ stack_name }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true
  when: (config_files.files | default([]) | selectattr('path', 'search', '\\.j2$') | list | length) > 0

- name: Fetch config template sources
  fetch:
    src: "{{ item.path }}"
    dest: "/tmp/ansible-stack-configs/{{ stack_name }}/{{ item.path | replace(stack_path + '/configs/', '') | replace('/', '_') }}"
    flat: true
  loop: "{{ config_files.files | default([]) }}"
  when: item.path.endswith('.j2')
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Render config templates
  template:
    src: "/tmp/ansible-stack-configs/{{ stack_name }}/{{ item.path | replace(stack_path + '/configs/', '') | replace('/', '_') }}"
    dest: "{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop: "{{ config_files.files | default([]) }}"
  when: item.path.endswith('.j2')
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Create static docker configs
  community.docker.docker_config:
    name: "{{ stack_name }}_{{ item.path | basename }}"
    data_src: "{{ item.path }}"
    state: present
  loop: "{{ config_files.files | default([]) }}"
  when: not item.path.endswith('.j2')
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Create rendered docker configs
  community.docker.docker_config:
    name: "{{ stack_name }}_{{ item.path | basename | regex_replace('\\.j2$', '') }}"
    data_src: "{{ item.path | regex_replace('\\.j2$', '') }}"
    state: present
  loop: "{{ config_files.files | default([]) }}"
  when: item.path.endswith('.j2')
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Remove temporary config sources from controller
  file:
    path: "/tmp/ansible-stack-configs/{{ stack_name }}"
    state: absent
  delegate_to: localhost
  run_once: true
  when: (config_files.files | default([]) | selectattr('path', 'search', '\\.j2$') | list | length) > 0
