---
- name: Read Compose networks
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ stack_compose_paths }}"
  register: stack_compose_network_files

- name: Combine Compose networks
  ansible.builtin.set_fact:
    stack_compose_networks: >-
      {{
        stack_compose_networks | default({})
        | combine(
            (item.content | b64decode | from_yaml).networks | default({}),
            recursive=True
          )
      }}
  loop: "{{ stack_compose_network_files.results }}"
  loop_control:
    label: "{{ item.source }}"

- name: Create stack networks
  community.docker.docker_network:
    name: "{{ item.value.name | default(item.key) }}"
    driver: "{{ item.value.driver | default('overlay') }}"
    scope: swarm
    attachable: "{{ item.value.attachable | default(omit) }}"
    state: present
  loop: "{{ stack_definition.networks | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.value.name | default(item.key) }}"
  run_once: true
  when: >-
    item.key not in (stack_compose_networks | default({}))
    or (stack_compose_networks[item.key].external | default(false) | bool)
