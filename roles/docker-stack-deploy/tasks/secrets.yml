---
- name: Check secrets directory
  ansible.builtin.stat:
    path: "{{ stack_path }}/secrets"
  register: stack_secret_directory
  run_once: true


- name: Find secret files
  ansible.builtin.find:
    paths: "{{ stack_path }}/secrets"
    recurse: false
    file_type: file
  register: stack_secret_files
  when: stack_secret_directory.stat.isdir | default(false)
  run_once: true


- name: Combine Compose secrets
  ansible.builtin.set_fact:
    stack_compose_secrets: >-
      {{
        stack_compose_secrets | default({})
        | combine(
            (item.content | b64decode | from_yaml).secrets | default({}),
            recursive=True
          )
      }}
  loop: "{{ stack_compose_network_files.results }}"
  loop_control:
    label: "{{ item.source }}"
  run_once: true


- name: Create Docker secrets
  community.docker.docker_secret:
    name: "{{ stack_compose_secrets[item.path | basename].name | default(item.path | basename) }}"
    data_src: "{{ item.path }}"
    state: present
  loop: "{{ stack_secret_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - item.path | basename in stack_compose_secrets
    - stack_compose_secrets[item.path | basename].external | default(false) | bool
  no_log: true
  run_once: true
