---
- name: Find secret files
  ansible.builtin.find:
    paths: "{{ stack_path }}/secrets"
    patterns: "*.age"
    recurse: false
    file_type: file
  register: stack_encrypted_secret_files
  run_once: true


- name: Ensure age installed
  ansible.builtin.package:
    name: age
    state: present
  when: (stack_encrypted_secret_files.files | default([])) | length > 0
  run_once: true


- name: Create Docker secrets
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        path: /run
        prefix: ansible-docker-secret-
        state: directory
      register: stack_secret_temporary_directory


    - name: Copy encrypted files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ stack_secret_temporary_directory.path }}/{{ item.path | basename }}"
        remote_src: true
        mode: "0600"
      loop: "{{ stack_encrypted_secret_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"


    - name: Write age identity
      ansible.builtin.copy:
        content: "{{ lookup('env', 'docker_secret_age_identity') | replace('\\n', '\n') }}"
        dest: "{{ stack_secret_temporary_directory.path }}/age-identity"
        mode: "0600"
      no_log: true


    - name: Decrypt secret files
      ansible.builtin.command:
        argv:
          - age
          - --decrypt
          - --identity
          - "{{ stack_secret_temporary_directory.path }}/age-identity"
          - --output
          - "{{ stack_secret_temporary_directory.path }}/{{ stack_secret_key }}"
          - "{{ stack_secret_temporary_directory.path }}/{{ item.path | basename }}"
      vars:
        stack_secret_key: "{{ item.path | basename | regex_replace('[.]age$', '') }}"
      loop: "{{ stack_encrypted_secret_files.files | default([]) }}"
      loop_control:
        label: "{{ stack_secret_key }}"
      no_log: true


    - name: Create Swarm secrets
      community.docker.docker_secret:
        name: "{{ stack_secret_key }}"
        data_src: "{{ stack_secret_temporary_directory.path }}/{{ stack_secret_key }}"
        state: present
      vars:
        stack_secret_key: "{{ item.path | basename | regex_replace('[.]age$', '') }}"
      loop: "{{ stack_encrypted_secret_files.files | default([]) }}"
      loop_control:
        label: "{{ stack_secret_key }}"
      no_log: true


  always:
    - name: Remove secret directory
      ansible.builtin.file:
        path: "{{ stack_secret_temporary_directory.path }}"
        state: absent
      when:
        - stack_secret_temporary_directory is defined
        - stack_secret_temporary_directory.path is defined
      no_log: true
  when: (stack_encrypted_secret_files.files | default([])) | length > 0
  run_once: true
