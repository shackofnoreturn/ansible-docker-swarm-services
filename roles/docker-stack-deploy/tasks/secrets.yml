---
- name: Check secrets directory
  stat:
    path: "{{ stack_path }}/secrets"
  register: stack_secrets_directory
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Find secret templates
  find:
    paths: "{{ stack_path }}/secrets"
    patterns: "*.j2"
    recurse: true
    file_type: file
  register: secret_templates
  when: stack_secrets_directory.stat.isdir | default(false)
  delegate_to: "{{ docker_active_manager }}"
  run_once: true

- name: Prepare and create stack secrets
  block:
    - name: Ensure controller secret source directory exists
      file:
        path: "/tmp/ansible-stack-secrets/{{ stack_name }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true

    - name: Fetch secret template sources
      fetch:
        src: "{{ item.path }}"
        dest: "/tmp/ansible-stack-secrets/{{ stack_name }}/{{ item.path | replace(stack_path + '/secrets/', '') | replace('/', '_') }}"
        flat: true
      loop: "{{ secret_templates.files }}"
      no_log: true
      delegate_to: "{{ docker_active_manager }}"
      run_once: true

    - name: Create temporary secret directory
      file:
        path: "/tmp/{{ stack_name }}-secrets"
        state: directory
        mode: "0700"
      delegate_to: "{{ docker_active_manager }}"
      run_once: true

    - name: Render secret templates
      template:
        src: "/tmp/ansible-stack-secrets/{{ stack_name }}/{{ item.path | replace(stack_path + '/secrets/', '') | replace('/', '_') }}"
        dest: "/tmp/{{ stack_name }}-secrets/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      loop: "{{ secret_templates.files }}"
      no_log: true
      delegate_to: "{{ docker_active_manager }}"
      run_once: true

    - name: Create docker secrets
      community.docker.docker_secret:
        name: "{{ stack_name }}_{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        data_src: "/tmp/{{ stack_name }}-secrets/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        state: present
      loop: "{{ secret_templates.files }}"
      no_log: true
      delegate_to: "{{ docker_active_manager }}"
      run_once: true
  always:
    - name: Remove temporary secrets from manager
      file:
        path: "/tmp/{{ stack_name }}-secrets"
        state: absent
      delegate_to: "{{ docker_active_manager }}"
      run_once: true

    - name: Remove temporary secret sources from controller
      file:
        path: "/tmp/ansible-stack-secrets/{{ stack_name }}"
        state: absent
      delegate_to: localhost
      run_once: true
  when: (secret_templates.files | default([]) | length) > 0
