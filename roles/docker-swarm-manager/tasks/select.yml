---
- name: Fail if no reachable Swarm manager exists
  ansible.builtin.fail:
    msg: >-
      No reachable Docker Swarm managers were found for
      environment '{{ docker_environment }}'.

      Manager candidates:
      {{ docker_swarm_manager_candidates | join(', ') }}
  when:
    - docker_available_managers | length == 0

- name: Select first available manager
  ansible.builtin.set_fact:
    docker_deploy_manager: "{{ docker_available_managers | first }}"

- name: Display selected manager
  ansible.builtin.debug:
    msg:
      - "Environment: {{ docker_environment }}"
      - "Manager candidates: {{ docker_swarm_manager_candidates | join(', ') }}"
      - "Reachable managers: {{ docker_reachable_managers | join(', ') }}"
      - "Available managers: {{ docker_available_managers | join(', ') }}"
      - "Selected manager: {{ docker_deploy_manager }}"