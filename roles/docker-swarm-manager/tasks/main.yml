---
- name: Determine environment
  ansible.builtin.set_fact:
    docker_environment: >-
      {{
        group_names
        | intersect(docker_swarm_manager_environment_groups)
        | first
      }}
  run_once: true


- name: Validate environment
  ansible.builtin.assert:
    that:
      - docker_environment is defined
      - docker_environment | length > 0
    fail_msg: >-
      Could not determine the Docker environment.
      Expected one of:
      {{ docker_swarm_manager_environment_groups | join(', ') }}
  run_once: true


- name: Determine manager candidates
  ansible.builtin.set_fact:
    docker_swarm_manager_candidates: >-
      {{
        groups['managers']
        | intersect(groups[docker_environment])
      }}
  run_once: true


- name: Validate manager candidates
  ansible.builtin.assert:
    that:
      - docker_swarm_manager_candidates | length > 0
    fail_msg: >-
      No manager candidates found for environment
      '{{ docker_environment }}'.
  run_once: true


- name: Discover reachable managers
  ansible.builtin.include_tasks: discover.yml
  run_once: true


- name: Select manager
  ansible.builtin.include_tasks: select.yml
  run_once: true
