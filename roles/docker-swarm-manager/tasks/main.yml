---
- name: Validate target environment
  ansible.builtin.assert:
    that:
      - docker_environment is defined
      - docker_environment | length > 0
      - docker_environment in docker_swarm_manager_environment_groups
    fail_msg: >-
      docker_environment must be one of:
      {{ docker_swarm_manager_environment_groups | join(', ') }}

- name: Determine manager candidates
  ansible.builtin.set_fact:
    docker_swarm_manager_candidates: >-
      {{
        groups['managers']
        | intersect(groups[docker_environment])
      }}

- name: Validate manager candidates
  ansible.builtin.assert:
    that:
      - docker_swarm_manager_candidates | length > 0
    fail_msg: >-
      No Docker Swarm manager candidates found for
      environment '{{ docker_environment }}'.

- name: Initialize manager lists
  ansible.builtin.set_fact:
    docker_reachable_managers: []
    docker_available_managers: []
    docker_deploy_manager: ""

- name: Discover reachable managers
  ansible.builtin.include_tasks:
    file: discover.yml

- name: Select deployment manager
  ansible.builtin.include_tasks:
    file: select.yml
