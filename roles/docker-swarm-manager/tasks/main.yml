---
- name: Determine target environment
  ansible.builtin.set_fact:
    docker_environment: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars)
        | map(attribute='group_names')
        | flatten
        | intersect(docker_swarm_manager_environment_groups)
        | unique
        | first
      }}

- name: Validate target environment
  ansible.builtin.assert:
    that:
      - docker_environment is defined
      - docker_environment | length > 0
    fail_msg: >-
      Could not determine the Docker environment.

- name: Determine manager candidates
  ansible.builtin.set_fact:
    docker_swarm_manager_candidates: >-
      {{
        groups['managers']
        | intersect(groups[docker_environment])
      }}

- name: Validate manager candidates
  ansible.builtin.assert:
    that:
      - docker_swarm_manager_candidates | length > 0
    fail_msg: >-
      No Docker manager candidates found for environment
      '{{ docker_environment }}'.

- name: Initialize manager lists
  ansible.builtin.set_fact:
    docker_reachable_managers: []
    docker_available_managers: []
    docker_deploy_manager: ""

- name: Discover reachable managers
  ansible.builtin.include_tasks:
    file: discover.yml

- name: Select deployment manager
  ansible.builtin.include_tasks:
    file: select.yml
