---
- name: Check Docker Swarm manager candidates
  ansible.builtin.command:
    cmd: docker node ls
  delegate_to: "{{ item }}"
  loop: "{{ docker_swarm_manager_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: docker_swarm_manager_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true


- name: DEBUG - Display reachable managers
  ansible.builtin.debug:
    msg: "{{ docker_swarm_manager_checks }}"




- name: Build available manager list
  ansible.builtin.set_fact:
    docker_available_managers: >-
      {{
        docker_swarm_manager_checks.results
        | selectattr('unreachable', 'undefined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}


- name: DEBUG - Display available managers
  ansible.builtin.debug:
    msg: "{{ docker_available_managers }}"


- name: Report unreachable managers
  ansible.builtin.debug:
    msg: "Skipping unreachable manager: {{ item.item }}"
  loop: "{{ docker_swarm_manager_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.unreachable is defined

- name: Report non-manager nodes
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} is reachable but is not a Docker Swarm manager.
  loop: "{{ docker_swarm_manager_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.unreachable is not defined
    - item.rc | default(1) != 0