---
- name: Check Docker Swarm manager status
  ansible.builtin.command:
    cmd: /usr/bin/docker node ls
  register: docker_swarm_manager_check
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Record reachable Swarm manager
  ansible.builtin.set_fact:
    docker_is_available_manager: true
  when:
    - docker_swarm_manager_check.unreachable is not defined
    - docker_swarm_manager_check.rc == 0

- name: Record non-manager
  ansible.builtin.set_fact:
    docker_is_available_manager: false
  when:
    - docker_swarm_manager_check.unreachable is not defined
    - docker_swarm_manager_check.rc != 0

- name: Record unreachable host
  ansible.builtin.set_fact:
    docker_is_available_manager: false
  when:
    - docker_swarm_manager_check.unreachable is defined