---
- name: Check SSH availability of manager candidates
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].ansible_host | default(item) }}"
    port: "{{ docker_swarm_manager_ssh_port }}"
    state: started
    timeout: "{{ docker_swarm_manager_ssh_timeout }}"
    connect_timeout: "{{ docker_swarm_manager_probe_timeout }}"
  loop: "{{ docker_swarm_manager_candidates }}"
  register: docker_manager_ssh_checks
  delegate_to: localhost
  changed_when: false
  failed_when: false

- name: Build reachable manager list
  ansible.builtin.set_fact:
    docker_reachable_managers: >-
      {{
        docker_manager_ssh_checks.results
        | selectattr('failed', 'equalto', false)
        | map(attribute='item')
        | list
      }}

- name: Report unreachable managers
  ansible.builtin.debug:
    msg: "Skipping unreachable manager: {{ item.item }}"
  loop: "{{ docker_manager_ssh_checks.results }}"
  when:
    - item.failed | default(false)

- name: Check Docker Swarm manager status
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{.Swarm.ControlAvailable}}" }}'
  delegate_to: "{{ item }}"
  loop: "{{ docker_reachable_managers }}"
  register: docker_swarm_manager_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Build available manager list
  ansible.builtin.set_fact:
    docker_available_managers: >-
      {{
        docker_swarm_manager_checks.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'defined')
        | selectattr('stdout', 'equalto', 'true')
        | map(attribute='item')
        | list
      }}

- name: Report hosts that are not Swarm managers
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} is reachable but is not currently
      a Docker Swarm manager.
  loop: "{{ docker_swarm_manager_checks.results }}"
  when:
    - item.rc is defined
    - item.rc == 0
    - item.stdout | trim != 'true'
