---
- name: Check Docker Swarm state on manager candidates
  ansible.builtin.command:
    cmd: docker info --format json
  delegate_to: "{{ item }}"
  loop: "{{ docker_swarm_manager_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: docker_swarm_manager_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: DEBUG
  ansible.builtin.debug:
    var: docker_swarm_manager_checks

- name: Build available manager list
  ansible.builtin.set_fact:
    docker_available_managers: >-
      {{
        docker_swarm_manager_checks.results
        | selectattr('unreachable', 'undefined')
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'defined')
        | selectattr('stdout', 'ne', '')
        | selectattr('stdout', 'search', '"ControlAvailable"')
        | map(attribute='item')
        | list
      }}

- name: Report unreachable managers
  ansible.builtin.debug:
    msg: "Skipping unreachable manager: {{ item.item }}"
  loop: "{{ docker_swarm_manager_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.unreachable is defined

- name: Report Docker query failures
  ansible.builtin.debug:
    msg: >-
      Could not query Docker on {{ item.item }}.
      Return code: {{ item.rc | default('unknown') }}
      Error: {{ item.msg | default('unknown') }}
  loop: "{{ docker_swarm_manager_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.unreachable is not defined
    - item.rc | default(1) != 0