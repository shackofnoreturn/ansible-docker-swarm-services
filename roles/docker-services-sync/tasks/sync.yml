---
- name: Ensure git installed
  apt:
    name: git
    state: present
    update_cache: true

- name: Ensure services directory exists
  file:
    path: "{{ docker_services_root }}"
    state: directory
    mode: "0755"

- name: Clone repository
  git:
    repo: "{{ docker_services_repo }}"
    dest: "{{ docker_services_root }}"
    version: "{{ docker_git_branch }}"
    force: true
    accept_hostkey: true

- name: Determine current commit
  command:
    cmd: git rev-parse HEAD
    chdir: "{{ docker_services_root }}"
  register: git_commit
  changed_when: false

- name: Show synchronized commit
  debug:
    msg:
      - "Environment : {{ docker_environment }}"
      - "Branch      : {{ docker_git_branch }}"
      - "Commit      : {{ git_commit.stdout }}"
